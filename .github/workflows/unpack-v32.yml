name: Unpack v32 preview

on:
  push:
    paths:
      - 'transfer/v32.ready'
  pull_request:
    branches: [main]
    paths:
      - 'transfer/v32.pr-trigger'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Repair exact transfer chunk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          bad = Path('transfer/v32.part03.b64').read_bytes()
          expected = 'fb0b241f6b93f8d90c322566843cb76756ad42e0'

          def git_blob_sha(data: bytes) -> str:
              header = f'blob {len(data)}\0'.encode()
              return hashlib.sha1(header + data).hexdigest()

          if git_blob_sha(bad) == expected:
              fixed = bad
          else:
              fixed = None
              for i in range(len(bad)):
                  candidate = bad[:i] + bad[i+1:]
                  if git_blob_sha(candidate) == expected:
                      print(f'Repaired part03 by deleting byte at offset {i}: {bad[i:i+1]!r}')
                      fixed = candidate
                      break
          if fixed is None:
              raise SystemExit('Could not reconstruct exact part03 from one-byte deletion')
          Path('/tmp/v32.part03.fixed.b64').write_bytes(fixed)
          print('part03 exact Git blob SHA:', git_blob_sha(fixed))
          PY
      - name: Decode and verify v32
        shell: bash
        run: |
          set -euo pipefail
          cat \
            transfer/v32.part00.b64 \
            transfer/v32.part01.b64 \
            transfer/v32.part02.b64 \
            /tmp/v32.part03.fixed.b64 \
            transfer/v32.part04.b64 \
            > /tmp/v32.html.gz.b64
          base64 --decode /tmp/v32.html.gz.b64 > /tmp/v32.html.gz
          gzip -dc /tmp/v32.html.gz > v32.html
          echo "a0acbfa8062649e9b773cf4abe8d9f62958fe3f2cf508895318f321cfe659f35  v32.html" | sha256sum -c -
          test "$(git hash-object v32.html)" = "9d15917fd73a809e36523b31733f683da901b834"
          grep -q 'Прототип v32 · Полный конфигуратор' v32.html
          grep -q '<option value="wallPanel">Стеновые панели</option>' v32.html
          grep -q '<option value="hardware">Фурнитура</option>' v32.html
      - name: Commit v32.html
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v32.html
          if git diff --cached --quiet; then
            echo "v32.html already current"
            exit 0
          fi
          git commit -m "Publish full v32 preview"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            git push origin HEAD:main
          fi
