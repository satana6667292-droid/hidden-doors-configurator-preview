name: Build v33 dictionaries

on:
  push:
    paths:
      - 'scripts/apply_v33_dictionaries.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v33
        run: python scripts/apply_v33_dictionaries.py
      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v33.html
          if git diff --cached --quiet; then
            echo "v33.html already current"
            exit 0
          fi
          git commit -m "Build v33 dictionary rules preview"
          git push
