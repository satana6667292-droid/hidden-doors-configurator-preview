name: Build v34 hardware dictionaries

on:
  push:
    paths:
      - 'scripts/apply_v34_hardware_dictionary_forms.py'
      - 'v34.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v34
        run: python scripts/apply_v34_hardware_dictionary_forms.py
      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v34.html
          if git diff --cached --quiet; then
            echo "v34.html already current"
            exit 0
          fi
          git commit -m "Build v34 hardware dictionary forms preview"
          git push
